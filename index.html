<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Masini 3D Split Screen</title>
<style>
  body { margin: 0; overflow: hidden; background: #111; }
  #crash {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 40px; color: yellow; display: none;
    text-shadow: 0 0 10px black;
  }
</style>
</head>
<body>

<div id="crash">ACCIDENT!</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
/* === SCENĂ === */
const scene = new THREE.Scene();

/* === CAMERE === */
const cam1 = new THREE.PerspectiveCamera(70, window.innerWidth/2 / window.innerHeight, 0.1, 1000);
const cam2 = new THREE.PerspectiveCamera(70, window.innerWidth/2 / window.innerHeight, 0.1, 1000);

/* === RENDERER === */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

/* === LUMINI (mai luminos) === */
const light = new THREE.DirectionalLight(0xffffff, 2.2);
light.position.set(20, 40, 20);
scene.add(light);

const ambient = new THREE.AmbientLight(0xffffff, 1.2);
scene.add(ambient);

/* === PODEA / STRADĂ === */
const road = new THREE.Mesh(
  new THREE.PlaneGeometry(300, 40),
  new THREE.MeshPhongMaterial({ color: 0x222222 })
);
road.rotation.x = -Math.PI / 2;
scene.add(road);

/* === CASE === */
function addHouse(x, z) {
  const house = new THREE.Mesh(
    new THREE.BoxGeometry(6, 4, 6),
    new THREE.MeshPhongMaterial({ color: 0xaa8844 })
  );
  house.position.set(x, 2, z);
  scene.add(house);

  const roof = new THREE.Mesh(
    new THREE.ConeGeometry(4.5, 3, 4),
    new THREE.MeshPhongMaterial({ color: 0x552200 })
  );
  roof.position.set(x, 5, z);
  scene.add(roof);
}

addHouse(-25, -25);
addHouse(25, -25);
addHouse(-25, 25);
addHouse(25, 25);

/* === COPACI === */
function addTree(x, z) {
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.5, 0.5, 3),
    new THREE.MeshPhongMaterial({ color: 0x553300 })
  );
  trunk.position.set(x, 1.5, z);
  scene.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(2),
    new THREE.MeshPhongMaterial({ color: 0x228833 })
  );
  leaves.position.set(x, 4, z);
  scene.add(leaves);
}

for (let i = -60; i <= 60; i += 20) {
  addTree(i, -35);
  addTree(i, 35);
}

/* === MAȘINI === */
function createCar(color) {
  const car = new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.BoxGeometry(2, 0.7, 4),
    new THREE.MeshPhongMaterial({ color })
  );
  body.position.y = 0.5;
  car.add(body);

  const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
  const wheelMat = new THREE.MeshPhongMaterial({ color: 0x111111 });

  function addWheel(x, z) {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI / 2;
    w.position.set(x, 0.2, z);
    car.add(w);
  }

  addWheel( 1,  1.5);
  addWheel(-1,  1.5);
  addWheel( 1, -1.5);
  addWheel(-1, -1.5);

  return car;
}

const car1 = createCar(0xff0000);
car1.position.set(-10, 0, 0);
scene.add(car1);

const car2 = createCar(0x0088ff);
car2.position.set(10, 0, 0);
scene.add(car2);

/* === CAMERE THIRD-PERSON === */
cam1.position.set(0, 6, -10);
cam1.lookAt(car1.position);

cam2.position.set(0, 6, -10);
cam2.lookAt(car2.position);

/* === CONTROALE === */
const keys = {};
document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

function driveCar(car, forward, backward, left, right, state) {
  const accel = 0.01;
  const maxSpeed = 0.4;
  const turnSpeed = 0.03;

  if (keys[forward]) state.speed = Math.min(maxSpeed, state.speed + accel);
  if (keys[backward]) state.speed = Math.max(-maxSpeed, state.speed - accel);

  if (keys[left]) car.rotation.y += turnSpeed * (state.speed >= 0 ? 1 : -1);
  if (keys[right]) car.rotation.y -= turnSpeed * (state.speed >= 0 ? 1 : -1);

  state.speed *= 0.98;

  car.position.x += Math.sin(car.rotation.y) * state.speed;
  car.position.z += Math.cos(car.rotation.y) * state.speed;
}

const state1 = { speed: 0 };
const state2 = { speed: 0 };

/* === COLIZIUNE === */
function checkCollision() {
  const b1 = new THREE.Box3().setFromObject(car1);
  const b2 = new THREE.Box3().setFromObject(car2);

  document.getElementById("crash").style.display =
    b1.intersectsBox(b2) ? "block" : "none";
}

/* === LOOP === */
function animate() {
  requestAnimationFrame(animate);

  // Mașina roșie – W A S D
  driveCar(car1, "w", "s", "a", "d", state1);
  // Mașina albastră – săgeți
  driveCar(car2, "arrowup", "arrowdown", "arrowleft", "arrowright", state2);

  checkCollision();

  // Actualizăm camerele third-person
  cam1.position.set(
    car1.position.x - Math.sin(car1.rotation.y) * 10,
    car1.position.y + 6,
    car1.position.z - Math.cos(car1.rotation.y) * 10
  );
  cam1.lookAt(car1.position);

  cam2.position.set(
    car2.position.x - Math.sin(car2.rotation.y) * 10,
    car2.position.y + 6,
    car2.position.z - Math.cos(car2.rotation.y) * 10
  );
  cam2.lookAt(car2.position);

  renderer.setScissorTest(true);

  // Ecran stânga – cam1
  renderer.setViewport(0, 0, window.innerWidth/2, window.innerHeight);
  renderer.setScissor(0, 0, window.innerWidth/2, window.innerHeight);
  renderer.render(scene, cam1);

  // Ecran dreapta – cam2
  renderer.setViewport(window.innerWidth/2, 0, window.innerWidth/2, window.innerHeight);
  renderer.setScissor(window.innerWidth/2, 0, window.innerWidth/2, window.innerHeight);
  renderer.render(scene, cam2);

  renderer.setScissorTest(false);
}

animate();

/* === REDIMENSIONARE FEREASTRĂ === */
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  cam1.aspect = (window.innerWidth/2) / window.innerHeight;
  cam2.aspect = (window.innerWidth/2) / window.innerHeight;
  cam1.updateProjectionMatrix();
  cam2.updateProjectionMatrix();
});
</script>
</body>
</html>
